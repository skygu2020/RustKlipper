# CI for the Rust Klipper host implementation only.
# The original Python host / MCU firmware build is intentionally excluded.
name: Build test

on:
  push:
    paths:
      - "rustklipper/**"
      - ".github/workflows/build-test.yaml"
  pull_request:
    paths:
      - "rustklipper/**"
      - ".github/workflows/build-test.yaml"

jobs:
  rust-host:
    name: Rust host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: rustklipper
        run: cargo fmt --all -- --check

      - name: Run Rust host tests
        working-directory: rustklipper
        run: cargo test --workspace --all-targets
