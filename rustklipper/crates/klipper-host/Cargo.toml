[package]
name = "klipper-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Rust implementation of the Klipper host runtime"

[dependencies]
klipper-config = { path = "../klipper-config" }
klipper-gcode = { path = "../klipper-gcode" }
klipper-transport = { path = "../klipper-transport" }
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["io-util", "net", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
